<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiDoX Studio</title>
<meta name="description" content="Podcast-Editing für Coaches, Berater und Selbstständige.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2312141A'/%3E%3Cpath d='M7 7l10 10M17 7L7 17' stroke='%23E8A33D' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-bg text-ink font-body antialiased">

<!-- ============ NAV ============ -->
<header class="sticky top-0 z-50 border-b border-edge/80 bg-bg/85 backdrop-blur">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <a href="#top" class="flex items-baseline gap-2">
      <span class="font-display text-lg font-semibold tracking-tight text-ink">RiDo<span class="text-amber">X</span></span>
      <span class="font-mono text-[10px] uppercase tracking-[0.2em] text-mute border-l border-edge pl-2">Studio</span>
    </a>
    <div class="hidden items-center gap-8 md:flex">
      <a href="#leistungen" class="text-sm text-mute transition hover:text-ink" data-key="nav.leistungen"></a>
      <a href="#beispiele" class="text-sm text-mute transition hover:text-ink" data-key="nav.beispiele"></a>
      <a href="#ablauf" class="text-sm text-mute transition hover:text-ink" data-key="nav.ablauf"></a>
      <a href="#preise" class="text-sm text-mute transition hover:text-ink" data-key="nav.preise"></a>
      <a href="#faq" class="text-sm text-mute transition hover:text-ink" data-key="nav.faq"></a>
    </div>
    <div class="hidden md:block">
      <a href="#kontakt" data-cta="primary" class="rounded-full bg-amber px-5 py-2.5 font-mono text-xs font-medium uppercase tracking-wide text-bg transition hover:bg-amber/90" data-key="nav.cta"></a>
    </div>
    <button id="nav-toggle" aria-label="Menü öffnen" aria-expanded="false" class="flex h-9 w-9 items-center justify-center rounded-lg border border-edge text-ink md:hidden">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </nav>
  <div id="mobile-menu" class="hidden border-t border-edge bg-bg px-6 pb-6 md:hidden">
    <div class="flex flex-col gap-4 pt-4">
      <a href="#leistungen" class="text-sm text-mute hover:text-ink" data-key="nav.leistungen"></a>
      <a href="#beispiele" class="text-sm text-mute hover:text-ink" data-key="nav.beispiele"></a>
      <a href="#ablauf" class="text-sm text-mute hover:text-ink" data-key="nav.ablauf"></a>
      <a href="#preise" class="text-sm text-mute hover:text-ink" data-key="nav.preise"></a>
      <a href="#faq" class="text-sm text-mute hover:text-ink" data-key="nav.faq"></a>
      <a href="#kontakt" data-cta="primary" class="mt-2 rounded-full bg-amber px-5 py-2.5 text-center font-mono text-xs font-medium uppercase tracking-wide text-bg" data-key="nav.cta"></a>
    </div>
  </div>
</header>

<!-- ============ HERO ============ -->
<section id="top" class="relative overflow-hidden border-b border-edge">
  <div class="mx-auto max-w-7xl px-6 pb-20 pt-16 sm:pt-24">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="hero.eyebrow"></p>
    <h1 class="mt-6 max-w-3xl font-display text-4xl font-semibold leading-[1.08] tracking-tight text-ink sm:text-6xl" data-key="hero.headline"></h1>
    <p class="mt-6 max-w-xl text-base leading-relaxed text-mute sm:text-lg" data-key="hero.sub"></p>

    <div class="mt-9 flex flex-col gap-4 sm:flex-row sm:items-center">
      <a href="#kontakt" data-cta="primary" class="inline-flex items-center justify-center rounded-full bg-amber px-7 py-3.5 font-medium text-bg transition hover:bg-amber/90" data-key="hero.ctaPrimary"></a>
      <a href="#beispiele" class="inline-flex items-center justify-center gap-2 rounded-full border border-edge px-7 py-3.5 font-medium text-ink transition hover:border-mute">
        <span data-key="hero.ctaSecondary"></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </a>
    </div>

    <p class="mt-5 font-mono text-xs text-mute" data-key="hero.microtrust"></p>
  </div>

  <div class="hero-amb relative h-20 w-full overflow-hidden border-t border-edge/70 bg-bgsoft" aria-hidden="true">
    <div id="hero-amb-track" class="flex h-full w-full items-end gap-[3px] px-2"></div>
    <div class="pointer-events-none absolute inset-0 bg-gradient-to-r from-bg via-transparent to-bg"></div>
  </div>
</section>

<!-- ============ NUTZEN ============ -->
<section id="nutzen" class="border-b border-edge bg-bg">
  <div class="mx-auto max-w-7xl px-6 py-24 sm:py-28">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="nutzen.eyebrow"></p>
    <h2 class="mt-4 max-w-xl font-display text-3xl font-semibold tracking-tight sm:text-4xl" data-key="nutzen.heading"></h2>
    <div id="nutzen-grid" class="mt-14 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </div>
</section>

<!-- ============ WARUM MIT MIR ============ -->
<section id="ueber" class="border-b border-edge bg-bgsoft">
  <div class="mx-auto grid max-w-7xl grid-cols-1 gap-14 px-6 py-24 sm:py-28 lg:grid-cols-[1.1fr_0.9fr] lg:gap-10">
    <div>
      <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="ueber.eyebrow"></p>
      <h2 class="mt-4 font-display text-3xl font-semibold tracking-tight sm:text-4xl" data-key="ueber.heading"></h2>
      <div class="mt-6 space-y-4 text-base leading-relaxed text-mute">
        <p data-key="ueber.p1"></p>
        <p data-key="ueber.p2"></p>
        <p data-key="ueber.p3"></p>
      </div>
    </div>

    <div class="rounded-2xl border border-edge bg-surface p-6 sm:p-8">
      <p class="font-mono text-xs uppercase tracking-[0.2em] text-mute" data-key="ueber.statsLabel"></p>
      <div id="ueber-stats" class="mt-6 space-y-6"></div>
    </div>
  </div>
</section>

<!-- ============ BEISPIELE ============ -->
<section id="beispiele" class="border-b border-edge bg-bg">
  <div class="mx-auto max-w-7xl px-6 py-24 sm:py-28">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="beispiele.eyebrow"></p>
    <h2 class="mt-4 max-w-2xl font-display text-3xl font-semibold tracking-tight sm:text-4xl" data-key="beispiele.heading"></h2>
    <p class="mt-4 max-w-2xl text-base leading-relaxed text-mute" data-key="beispiele.intro"></p>
    <div id="examples-list" class="mt-14 space-y-6"></div>
  </div>
</section>

<!-- ============ ABLAUF ============ -->
<section id="ablauf" class="border-b border-edge bg-bgsoft">
  <div class="mx-auto max-w-7xl px-6 py-24 sm:py-28">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="ablauf.eyebrow"></p>
    <h2 class="mt-4 max-w-xl font-display text-3xl font-semibold tracking-tight sm:text-4xl" data-key="ablauf.heading"></h2>
    <div id="ablauf-grid" class="mt-14 grid grid-cols-1 gap-8 lg:grid-cols-3"></div>
  </div>
</section>

<!-- ============ LEISTUNGEN ============ -->
<section id="leistungen" class="border-b border-edge bg-bg">
  <div class="mx-auto max-w-7xl px-6 py-24 sm:py-28">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="leistungen.eyebrow"></p>
    <h2 class="mt-4 max-w-xl font-display text-3xl font-semibold tracking-tight sm:text-4xl" data-key="leistungen.heading"></h2>
    <div id="leistungen-grid" class="mt-14 grid grid-cols-1 gap-px overflow-hidden rounded-2xl border border-edge bg-edge sm:grid-cols-2 lg:grid-cols-3"></div>
  </div>
</section>

<!-- ============ PREISE ============ -->
<section id="preise" class="border-b border-edge bg-bgsoft">
  <div class="mx-auto max-w-7xl px-6 py-24 sm:py-28">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="preise.eyebrow"></p>
    <h2 class="mt-4 max-w-2xl font-display text-3xl font-semibold tracking-tight sm:text-4xl" data-key="preise.heading"></h2>

    <div class="mt-6 max-w-2xl rounded-xl border border-teal/30 bg-teal/5 px-5 py-4 text-sm leading-relaxed text-ink" data-key="preise.riskBanner"></div>

    <div id="preise-grid" class="mx-auto mt-14 grid max-w-4xl grid-cols-1 gap-6 sm:grid-cols-2"></div>
  </div>
</section>

<!-- ============ FAQ ============ -->
<section id="faq" class="border-b border-edge bg-bg">
  <div class="mx-auto max-w-4xl px-6 py-24 sm:py-28">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="faq.eyebrow"></p>
    <h2 class="mt-4 font-display text-3xl font-semibold tracking-tight sm:text-4xl" data-key="faq.heading"></h2>
    <div id="faq-list" class="mt-12 divide-y divide-edge border-y border-edge"></div>
  </div>
</section>

<!-- ============ FINAL CTA ============ -->
<section id="kontakt" class="relative overflow-hidden border-b border-edge bg-bgsoft">
  <div class="mx-auto max-w-3xl px-6 py-24 text-center sm:py-32">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-teal" data-key="cta.eyebrow"></p>
    <h2 class="mt-5 font-display text-3xl font-semibold tracking-tight sm:text-5xl" data-key="cta.heading"></h2>
    <p class="mx-auto mt-5 max-w-xl text-base leading-relaxed text-mute" data-key="cta.sub"></p>
    <a href="#kontakt" data-cta="primary" class="mt-9 inline-flex items-center justify-center rounded-full bg-amber px-8 py-4 font-medium text-bg transition hover:bg-amber/90" data-key="cta.button"></a>
    <p class="mt-4 font-mono text-xs text-mute" data-key="cta.microtrust"></p>
  </div>
</section>

<!-- ============ FOOTER ============ -->
<footer class="bg-bg">
  <div class="mx-auto max-w-7xl px-6 py-16">
    <div class="grid grid-cols-1 gap-10 sm:grid-cols-2 lg:grid-cols-4">
      <div class="lg:col-span-2">
        <a href="#top" class="flex items-baseline gap-2">
          <span class="font-display text-lg font-semibold tracking-tight text-ink">RiDo<span class="text-amber">X</span></span>
          <span class="font-mono text-[10px] uppercase tracking-[0.2em] text-mute border-l border-edge pl-2">Studio</span>
        </a>
        <p class="mt-3 max-w-sm text-sm leading-relaxed text-mute" data-key="footer.tagline"></p>
      </div>
      <div>
        <p class="font-mono text-xs uppercase tracking-wide text-mute" data-key="footer.navHeading"></p>
        <ul id="footer-nav-links" class="mt-4 space-y-2 text-sm"></ul>
      </div>
      <div>
        <p class="font-mono text-xs uppercase tracking-wide text-mute" data-key="footer.legalHeading"></p>
        <ul id="footer-legal-links" class="mt-4 space-y-2 text-sm"></ul>
      </div>
    </div>
    <div class="mt-14 flex flex-col gap-4 border-t border-edge pt-8 text-xs text-mute sm:flex-row sm:items-center sm:justify-between">
      <span data-key="footer.copyright"></span>
      <a href="#kontakt" data-cta="primary" class="text-ink underline underline-offset-4 hover:text-amber" data-key="footer.cta"></a>
    </div>
  </div>
</footer>

<script src="js/icons.js"></script>
<script src="js/content-de.js"></script>
<script src="js/render-content.js"></script>
<script src="js/audio-engine.js"></script>
<script src="js/audio-examples.js"></script>
<script src="js/nav.js"></script>
<script src="js/hero-waveform.js"></script>
<script src="js/main.js"></script>
</body>
</html>
